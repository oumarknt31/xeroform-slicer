[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slicerkit"
dynamic = ["version"]               # from slicerkit.__version__
description = "XeroForm Slicer: open-source SLS slicing (3D models -> laser tool-paths) for the XeroForm printer"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Oumar Kante" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "PythonSLM>=0.6",
    "trimesh>=4.0,<6",   # PySLM 0.6 uses Path.to_planar, deprecated in trimesh
    "numpy>=1.24",
    "scipy>=1.10",
    "lxml>=4.9",          # trimesh needs it to read .3mf
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
gui = ["PySide6-Essentials>=6.5"]

[project.scripts]
xeroform = "slicerkit.__main__:main"
slicerkit = "slicerkit.__main__:main"          # old name, kept working

[project.gui-scripts]
xeroform-gui = "slicerkit.gui:main"
slicerkit-gui = "slicerkit.gui:main"           # old name, kept working

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "slicerkit.__version__" }

[tool.setuptools.package-data]
"slicerkit.gui" = ["assets/*.svg"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E9", "B", "S"]
ignore = ["S101", "S311", "B905"]   # asserts in tests; non-crypto random; zip(strict=) is 3.10+
