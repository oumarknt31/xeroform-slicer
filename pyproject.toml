[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slicerkit"
version = "0.1.0"
description = "Open-source SLS slicing engine (STL -> .cli laser tool-paths) for the XeroForm printer"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Oumar Kante" }]
dependencies = [
    "PythonSLM>=0.6",
    "trimesh>=4.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
slicerkit = "slicerkit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
