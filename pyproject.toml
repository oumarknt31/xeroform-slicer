[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slicerkit"
version = "0.1.0"
description = "Open-source SLS slicing engine (STL -> .cli laser tool-paths) for the XeroForm printer"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Oumar Kante" }]
dependencies = [
    "PythonSLM>=0.6",
    "trimesh>=4.0,<6",   # PySLM 0.6 uses Path.to_planar, deprecated in trimesh
    "numpy>=1.24",
    "scipy>=1.10",
    "lxml>=4.9",          # trimesh needs it to read .3mf
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = ["PySide6-Essentials>=6.5"]

[project.scripts]
slicerkit = "slicerkit.__main__:main"

[project.gui-scripts]
slicerkit-gui = "slicerkit.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
