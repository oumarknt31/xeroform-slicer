name: Release

# Push a version tag (git tag v0.1.1 && git push origin v0.1.1) to build the
# desktop app for every platform, check each build starts, and publish them as
# a GitHub Release with SHA256SUMS.txt. "Run workflow" builds without publishing.
#
# File names carry no version, so the installers can always download
# https://github.com/oumarknt31/xeroform-slicer/releases/latest/download/<file>.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       name: macOS-AppleSilicon }
          - { os: macos-15-intel, name: macOS-Intel }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-22.04,   name: Linux }
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      ASSET: XeroForm-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: pip install -e ".[gui]" "pyinstaller>=6.10" pillow
      - name: Icons
        run: python tools/make_icons.py
      - name: Build the app
        run: pyinstaller packaging/xeroform.spec --noconfirm

      - name: Check the build starts and slices (macOS)
        if: runner.os == 'macOS'
        run: dist/XeroForm.app/Contents/MacOS/XeroForm --smoke-test
      - name: Check the build starts and slices (Linux)
        if: runner.os == 'Linux'
        run: dist/XeroForm/XeroForm --smoke-test
      - name: Check the build starts and slices (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\XeroForm\XeroForm.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed: exit $($p.ExitCode)" }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/XeroForm.app "$ASSET.zip"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\XeroForm -DestinationPath "$env:ASSET.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf "$ASSET.tar.gz" -C dist XeroForm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}.*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum XeroForm-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --title "XeroForm ${{ github.ref_name }}" \
            --notes-file packaging/RELEASE_NOTES.md
