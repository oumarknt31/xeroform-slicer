name: Release

# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to build the
# desktop app for every platform, check each build starts, and publish them as
# a GitHub Release. "Run workflow" builds without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       name: macOS-AppleSilicon }
          - { os: macos-15-intel, name: macOS-Intel }
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-22.04,   name: Linux }
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      ASSET: XeroForm-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: pip install -e ".[gui]" "pyinstaller>=6.10" pillow
      - name: Icons
        run: python tools/make_icons.py
      - name: Build the app
        run: pyinstaller packaging/xeroform.spec --noconfirm

      - name: Check the build starts and slices (macOS)
        if: runner.os == 'macOS'
        run: dist/XeroForm.app/Contents/MacOS/XeroForm --smoke-test
      - name: Check the build starts and slices (Linux)
        if: runner.os == 'Linux'
        run: dist/XeroForm/XeroForm --smoke-test
      - name: Check the build starts and slices (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\XeroForm\XeroForm.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed: exit $($p.ExitCode)" }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/XeroForm.app "$ASSET.zip"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\XeroForm -DestinationPath "$env:ASSET.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf "$ASSET.tar.gz" -C dist XeroForm

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}.*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --title "XeroForm ${{ github.ref_name }}" \
            --notes-file packaging/RELEASE_NOTES.md
