name: Installers

# Runs each one-line installer against the latest release on a fresh machine,
# then checks the installed app carries no "downloaded from the internet" mark
# (so there's no security prompt) and that it starts and slices.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      XEROFORM_NO_OPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install and check (macOS)
        if: runner.os == 'macOS'
        env:
          XEROFORM_DEST: ${{ runner.temp }}/Applications
        run: |
          mkdir -p "$XEROFORM_DEST"
          sh install/install-mac.sh
          if xattr -r "$XEROFORM_DEST/XeroForm.app" | grep -q quarantine; then echo "quarantined!"; exit 1; fi
          "$XEROFORM_DEST/XeroForm.app/Contents/MacOS/XeroForm" --smoke-test

      - name: Install and check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:XEROFORM_DEST = Join-Path $env:RUNNER_TEMP 'Programs'
          ./install/install-windows.ps1
          $exe = Join-Path $env:XEROFORM_DEST 'XeroForm\XeroForm.exe'
          if (Get-Item $exe -Stream Zone.Identifier -ErrorAction SilentlyContinue) { throw "marked as downloaded" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'XeroForm.lnk'))) { throw "no shortcut" }
          $p = Start-Process $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed: exit $($p.ExitCode)" }

      - name: Install and check (Linux)
        if: runner.os == 'Linux'
        run: |
          sh install/install-linux.sh
          test -f "$HOME/.local/share/applications/xeroform.desktop"
          "$HOME/.local/bin/xeroform-gui" --smoke-test
